name: Windows executable

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/cli/**'
      - 'scripts/buildExe.ts'
      - 'scripts/makeSampleIbt.ts'
      - '.github/workflows/exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:exe

      - name: Parse the PowerShell the app runs
        shell: pwsh
        run: |
          node scripts/makeSampleIbt.ts sample.ibt ps
          foreach ($f in Get-ChildItem ps/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "parsed $($f.Name)"
          }

      - name: Run the executable
        shell: pwsh
        run: |
          $exe = ".\dist-exe\tire-lab.exe"
          & $exe inspect sample.ibt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # A file given alone is the drag-and-drop case.
          & $exe sample.ibt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $page = Get-Content sample.tire-lab.html -Raw
          if ($page -notmatch 'model LF carcass') { Write-Error 'the chart has no model line'; exit 1 }
          $status = & $exe app --self-test
          Write-Host $status
          if ($status -notmatch '"status":200' -or $status -notmatch '"canControl":true') { Write-Error 'the app did not answer'; exit 1 }
          # No simulator runs here: the broadcast goes to nobody, and must still succeed.
          & $exe telemetry on
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe telemetry off
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist-exe/tire-lab.exe -Algorithm SHA256).Hash | Out-File dist-exe/tire-lab.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tire-lab-win-x64
          path: |
            dist-exe/tire-lab.exe
            dist-exe/tire-lab.exe.sha256
